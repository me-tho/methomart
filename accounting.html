<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হিসাব সফটওয়্যার — MethoMart</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3D2B; --forest-dark:#152A1D; --gold:#D4A017; --gold-light:#E8C158;
    --ivory:#FBF6EC; --card:#F3ECDA; --maroon:#7A3B2E; --charcoal:#2B2B25;
    --muted:#6B6B5D; --line:#DFD5B8; --radius:14px; --danger:#B23A3A; --ok:#2F7A4A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Noto Serif Bengali', serif; background:var(--ivory); color:var(--charcoal); line-height:1.6;}
  h1,h2,h3,.brand{font-family:'Baloo Da 2', sans-serif;}
  button, input, select, textarea{font-family:inherit; font-size:.95rem;}
  a{color:inherit;}
  header{background:var(--forest); color:var(--ivory); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 12px rgba(0,0,0,.15); position:sticky; top:0; z-index:50;}
  header .brand{font-size:1.2rem; font-weight:800; color:var(--gold); display:flex; align-items:center; gap:10px;}
  header .brand span{color:var(--ivory); font-size:.85rem; font-weight:600;}
  header a.back{color:var(--gold-light); text-decoration:none; border:1.5px solid var(--gold); padding:6px 14px; border-radius:999px; font-weight:600; font-size:.85rem;}
  #sidebarToggle{display:none; background:none; border:1.5px solid var(--gold); color:var(--gold-light); width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:1.1rem;}

  .shell{display:flex; align-items:flex-start;}
  .sidebar{width:230px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line); min-height:calc(100vh - 61px); padding:14px 10px; position:sticky; top:61px; overflow-y:auto; max-height:calc(100vh - 61px);}
  .sidebar .grp-title{font-size:.72rem; color:var(--muted); text-transform:uppercase; font-weight:700; margin:12px 8px 4px;}
  .sidebar .tab-btn{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; color:var(--forest-dark); padding:9px 12px; border-radius:9px; font-weight:700; cursor:pointer; margin-bottom:2px; font-size:.88rem;}
  .sidebar .tab-btn:hover{background:#EFE6CC;}
  .sidebar .tab-btn.active{background:var(--forest); color:var(--ivory);}
  .main{flex:1; min-width:0; padding:18px;}
  .wrap{max-width:1200px; margin:0 auto;}

  @media (max-width:900px){
    #sidebarToggle{display:block;}
    .sidebar{position:fixed; left:0; top:61px; bottom:0; z-index:60; transform:translateX(-100%); transition:.2s; box-shadow:6px 0 20px rgba(0,0,0,.2);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55;}
    .sidebar-overlay.show{display:block;}
  }

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .card h2{color:var(--forest); font-size:1.15rem; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .stat .lbl{font-size:.78rem; color:var(--muted); font-weight:600;}
  .stat .val{font-size:1.35rem; font-weight:800; color:var(--forest); margin-top:2px;}
  .stat.warn .val{color:var(--danger);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--forest); color:var(--ivory); border:none; padding:9px 16px; border-radius:9px; font-weight:700; cursor:pointer;}
  .btn:hover{background:var(--forest-dark);}
  .btn.gold{background:var(--gold); color:var(--forest-dark);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.ghost{background:none; border:1.5px solid var(--line); color:var(--charcoal);}
  .btn.sm{padding:5px 11px; font-size:.8rem;}

  table{width:100%; border-collapse:collapse; font-size:.88rem;}
  th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap;}
  th{color:var(--forest); font-weight:700; background:#F8F3E4;}
  .tbl-wrap{overflow-x:auto;}
  tr:hover td{background:#FCFAF2;}
  .tag{display:inline-block; padding:3px 9px; border-radius:999px; font-size:.75rem; font-weight:700;}
  .tag.ok{background:#E4F2E7; color:var(--ok);}
  .tag.warn{background:#FDECEC; color:var(--danger);}
  .tag.mid{background:#FFF3D6; color:#8A6410;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-weight:700; margin-bottom:5px; font-size:.85rem; color:var(--forest-dark);}
  .field input, .field select, .field textarea{width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--charcoal);}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

  .item-row{display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center;}
  @media (max-width:640px){.item-row{grid-template-columns:1fr 1fr; }}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:flex-start; justify-content:center; padding:30px 12px; overflow-y:auto;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff; border-radius:var(--radius); max-width:640px; width:100%; padding:22px; position:relative;}
  .modal.wide{max-width:900px;}
  .modal .x{position:absolute; top:14px; right:16px; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--muted);}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--forest); color:var(--ivory); padding:11px 22px; border-radius:999px; font-weight:700; z-index:400; display:none; box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .empty{text-align:center; padding:30px; color:var(--muted);}
  .search-bar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .search-bar input, .search-bar select{padding:9px 11px; border:1.5px solid var(--line); border-radius:9px;}
  .muted{color:var(--muted); font-size:.85rem;}
  .totals-box{margin-top:10px; background:#F8F3E4; border-radius:10px; padding:12px 16px; max-width:320px; margin-left:auto;}
  .totals-box .tr{display:flex; justify-content:space-between; padding:4px 0; font-weight:600;}
  .totals-box .tr.grand{font-size:1.15rem; color:var(--forest); font-weight:800; border-top:1px solid var(--line); margin-top:4px; padding-top:8px;}

  /* ---- ইনভয়েস প্রিন্ট (মেঠোমার্ট ক্যাশ মেমো — হুবহু রেফারেন্স লেআউট) ---- */
  #invoicePrint{display:none;}
  .inv-box{--inv-color:#1F5F3F; width:720px; max-width:100%; margin:0 auto; padding:18px; font-family:'Noto Serif Bengali',serif; color:#000; background:#fff; font-size:.86rem; position:relative; overflow:hidden;}
  /* একটা মাত্র মাঝ-বরাবর লোগো না দিয়ে পুরো ইনভয়েস (হেডিং থেকে শুরু করে একদম নিচ পর্যন্ত) জুড়ে বার বার (টাইল) করে দেওয়া হচ্ছে, যাতে কোনো অংশই ফাঁকা না থাকে */
  .inv-watermark{position:absolute; inset:0; background-repeat:repeat; background-size:150px 150px; background-position:center; opacity:.09; z-index:0; pointer-events:none; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .inv-box > *:not(.inv-watermark){position:relative; z-index:1;}

  /* হেডার: বাঁয়ে লোগো+দোকানের নাম, ডানে CASH MEMO বক্স + যোগাযোগ লিংক */
  .inv-head2{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px;}
  .inv-head-left{display:flex; align-items:flex-start; gap:8px;}
  .inv-logo2{width:48px; height:48px; object-fit:contain; flex-shrink:0;}
  .inv-shop-bn{font-size:1.25rem; font-weight:800; color:var(--inv-color);}
  .inv-shop-en{font-size:.82rem; font-style:italic; color:#333;}
  .inv-shop-line{font-size:.78rem; color:#333;}
  .inv-head-right{text-align:right;}
  .cash-memo-box{display:inline-block; border:1.5px solid #000; padding:3px 10px; font-weight:800; font-size:.85rem; letter-spacing:.5px; margin-bottom:4px;}
  .inv-contact-line{font-size:.76rem; color:#1a5fb4; line-height:1.5;}

  /* নাম/ঠিকানা/মোবা (বামে) ও চালান নং/তারিখ (ডানে, শেষ প্রান্তে) */
  .inv-meta-flex{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px;}
  table.inv-meta-left{border-collapse:collapse;}
  table.inv-meta-left td{padding:3px 4px; font-size:.9rem; vertical-align:top;}
  table.inv-meta-left td.lbl{font-weight:700; white-space:nowrap; width:1%;}
  table.inv-meta-left td.val{border-bottom:1px dotted #999; min-width:140px;}
  .inv-meta-right{text-align:right; white-space:nowrap; flex-shrink:0;}
  .inv-meta-right .row{margin-bottom:6px; font-size:.9rem;}
  .inv-meta-right .lbl{font-weight:700;}
  .inv-meta-right .val{font-weight:700; background:#FCEFC7; padding:3px 8px; margin-left:6px; display:inline-block;}

  /* আইটেম টেবিল — শুধু যতগুলো পণ্য ততগুলো সারি, বিবরণ কলাম হলুদ, একক কলাম সবুজ */
  table.inv-tbl{width:100%; border-collapse:collapse; margin-bottom:8px;}
  table.inv-tbl th, table.inv-tbl td{border:1px solid #000; padding:4px 7px; font-size:.85rem;}
  table.inv-tbl th{background:#EDEDED; text-align:center; font-weight:700;}
  table.inv-tbl td.c-no{text-align:center; width:32px;}
  table.inv-tbl td.c-desc{background:transparent !important;}
  table.inv-tbl td.c-qty{text-align:center; width:60px;}
  table.inv-tbl td.c-unit{background:transparent !important; text-align:center; width:70px;}
  table.inv-tbl td.c-price{text-align:right; width:70px;}
  table.inv-tbl td.c-amt{text-align:right; width:90px;}

  /* কথায় (বামে) এবং মোট/পরিশোধ/বাকি (ডানে যতদূর সম্ভব প্রসারিত) একই সারিতে */
  .inv-summary-flex{display:flex; align-items:flex-start; gap:14px; margin:2px 0 8px;}
  .inv-words{font-size:.85rem; flex:1 1 auto; max-width:42%;}
  .inv-totals{border-collapse:collapse; margin-left:auto; width:300px; max-width:60%;}
  .inv-totals td{padding:4px 10px; font-size:.9rem; border:1px solid #cfcfcf;}
  .inv-totals tr.grand td{font-weight:800; color:var(--inv-color); font-size:1rem;}
  .inv-totals tr.grand td:first-child{background:#fff;}
  .inv-totals tr.grand td:last-child{background:#E1EFE3;}
  .inv-totals tr.paid td:last-child{background:#FCF6D9;}
  .inv-totals tr.due td:last-child{background:#F6DADA; font-weight:700;}
  .inv-totals td:first-child{font-weight:700;}
  .inv-totals td:last-child{text-align:right;}

  /* Courier / CTN / Fare / COD — টেবিল, চারপাশে বক্স বর্ডার, ভেতরে কোনো দাগ নেই, শুধু লেখা পর্যন্ত ছোট */
  table.inv-courier{width:auto; border-collapse:collapse; margin-top:8px; font-size:.85rem; border:1px solid #000;}
  table.inv-courier td{padding:3px 12px; border:none !important; font-weight:700; white-space:nowrap;}

  .inv-terms{font-size:.78rem; color:#333; margin-top:10px; white-space:pre-line; border-top:1px dashed #999; padding-top:6px;}
  .inv-foot2{display:flex; justify-content:space-between; margin-top:34px; font-size:.85rem;}
  .inv-footnote{text-align:center; font-size:.85rem; color:var(--inv-color); font-weight:700; margin-top:10px;}

  /* মডার্ন টেমপ্লেট: রঙিন হেডার ব্যান্ড */
  .inv-box.tpl-modern .inv-head2{border-bottom:none; background:var(--inv-color); color:#fff; padding:14px 10px; border-radius:8px 8px 0 0; margin:-18px -18px 12px -18px;}
  .inv-box.tpl-modern .inv-shop-bn, .inv-box.tpl-modern .inv-shop-en, .inv-box.tpl-modern .inv-shop-line{color:#fff;}
  .inv-box.tpl-modern .inv-contact-line{color:#fff;}
  .inv-box.tpl-modern table.inv-tbl th{background:var(--inv-color); color:#fff;}
  /* মিনিমাল টেমপ্লেট: হালকা বর্ডার, কম কালার */
  .inv-box.tpl-minimal .inv-head2{border-bottom:1px solid #ccc;}
  .inv-box.tpl-minimal table.inv-tbl th, .inv-box.tpl-minimal table.inv-tbl td{border:none; border-bottom:1px solid #ddd;}
  .inv-box.tpl-minimal table.inv-tbl th{background:#fff; border-bottom:2px solid var(--inv-color);}
  .inv-box.tpl-minimal td.c-desc, .inv-box.tpl-minimal td.c-unit{background:none;}
  @media print{
    body{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    body *{visibility:hidden;}
    #invoicePrint, #invoicePrint *{visibility:visible;}
    #invoicePrint{display:block; position:absolute; top:0; left:0; width:100%;}
  }
</style>
</head>
<body>

<header>
  <button id="sidebarToggle">☰</button>
  <div class="brand">🧮 <span>হিসাব সফটওয়্যার — MethoMart</span></div>
  <a class="back" href="admin.html">⟵ এডমিন প্যানেল</a>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ===== লগইন স্ক্রিন (আলাদাভাবে খুললে) ===== -->
<div id="loginScreen" style="display:none; min-height:70vh; align-items:center; justify-content:center; padding:30px;">
  <div style="max-width:360px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:30px;">
    <h1 style="color:var(--forest); text-align:center; margin-bottom:16px;">এডমিন লগইন</h1>
    <div class="field"><label>ইউজারনেম</label><input id="loginUser"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input id="loginPass" type="password"></div>
    <button class="btn gold" style="width:100%;" onclick="doLogin()">লগইন</button>
    <p class="muted" id="loginErr" style="margin-top:10px; color:var(--danger);"></p>
  </div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <nav class="sidebar" id="sidebarNav">
    <button class="tab-btn active" data-tab="dashboard">📊 ড্যাশবোর্ড</button>
    <div class="grp-title">Sales</div>
    <button class="tab-btn" data-tab="sale-new">🧾 নতুন বিক্রয়</button>
    <button class="tab-btn" data-tab="sale-list">📋 বিক্রয় তালিকা</button>
    <button class="tab-btn" data-tab="sale-return">↩️ বিক্রয় ফেরত</button>
    <div class="grp-title">Purchase</div>
    <button class="tab-btn" data-tab="purchase-new">🛒 নতুন ক্রয়</button>
    <button class="tab-btn" data-tab="purchase-list">📋 ক্রয় তালিকা</button>
    <button class="tab-btn" data-tab="purchase-return">↩️ ক্রয় ফেরত</button>
    <div class="grp-title">তালিকা</div>
    <button class="tab-btn" data-tab="customers">👥 গ্রাহক</button>
    <button class="tab-btn" data-tab="suppliers">🚚 সরবরাহকারী</button>
    <button class="tab-btn" data-tab="products">📦 পণ্য</button>
    <button class="tab-btn" data-tab="inventory">🏬 ইনভেন্টরি</button>
    <button class="tab-btn" data-tab="expenses">💸 খরচ</button>
    <button class="tab-btn" data-tab="cashbank">🏦 ক্যাশ ও ব্যাংক</button>
    <div class="grp-title">Accounts</div>
    <button class="tab-btn" data-tab="coa">📚 চার্ট অব অ্যাকাউন্টস</button>
    <button class="tab-btn" data-tab="journal">📝 জার্নাল</button>
    <button class="tab-btn" data-tab="ledger">📖 লেজার</button>
    <button class="tab-btn" data-tab="trialbalance">⚖️ ট্রায়াল ব্যালেন্স</button>
    <div class="grp-title">Reports</div>
    <button class="tab-btn" data-tab="rep-pl">📈 লাভ-ক্ষতি</button>
    <button class="tab-btn" data-tab="rep-bs">🏛️ ব্যালেন্স শীট</button>
    <button class="tab-btn" data-tab="rep-sales">🧾 বিক্রয় রিপোর্ট</button>
    <button class="tab-btn" data-tab="rep-purchase">🛒 ক্রয় রিপোর্ট</button>
    <button class="tab-btn" data-tab="rep-stock">📦 স্টক রিপোর্ট</button>
    <div class="grp-title">অন্যান্য</div>
    <button class="tab-btn" data-tab="settings">⚙️ সেটিংস</button>
  </nav>

  <div class="main"><div class="wrap" id="viewRoot">
    <div class="empty">লোড হচ্ছে…</div>
  </div></div>
</div>

<div class="toast" id="toast"></div>

<!-- মডাল কনটেইনার (জেনেরিক) -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<!-- ইনভয়েস প্রিন্ট এরিয়া -->
<div id="invoicePrint"></div>

<script>
/* ================= বেসিক সেটআপ ================= */
// ⚠️ admin.html-এ থাকা একই API_URL এখানে বসান
const API_URL = 'https://script.google.com/macros/s/AKfycbx5IeM7bh7obtu61EzNuoFRnZ-8LKmvIovx0cZFWI6-miKu3W8YVljZIW5fuZa_Ku6d8Q/exec';

function getAdminToken(){ return localStorage.getItem('mm_admin_token'); }
function setAdminToken(t){ localStorage.setItem('mm_admin_token', t); }

async function api(action, data){
  const res = await fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({action, adminToken:getAdminToken()}, data||{}))
  });
  return res.json();
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display='none', 2600);
}
function money(n){ return (Number(n)||0).toLocaleString('bn-BD',{maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function doLogin(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const r = await api('adminLogin', {username,password});
  if(!r.ok){ document.getElementById('loginErr').textContent = r.error||'লগইন ব্যর্থ'; return; }
  setAdminToken(r.token);
  boot();
}

async function boot(){
  if(!getAdminToken()){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appShell').style.display='none';
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='flex';
  loadTab(currentTab);
}

/* ================= বাংলা সংখ্যা → কথায় (টাকার জন্য) ================= */
function bnAmountInWords(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'শূন্য টাকা মাত্র';
  const ones=['','এক','দুই','তিন','চার','পাঁচ','ছয়','সাত','আট','নয়','দশ','এগার','বার','তের','চৌদ্দ','পনের','ষোল','সতের','আঠার','ঊনিশ'];
  const tens=['','','বিশ','ত্রিশ','চল্লিশ','পঞ্চাশ','ষাট','সত্তর','আশি','নব্বই'];
  function twoDigit(n){
    if(n<20) return ones[n];
    const t=Math.floor(n/10), o=n%10;
    return o===0? tens[t] : tens[t]+' '+ones[o];
  }
  function threeDigit(n){
    const h=Math.floor(n/100), r=n%100;
    let s='';
    if(h) s+= ones[h]+'শত ';
    if(r) s+= twoDigit(r);
    return s.trim();
  }
  let n=num, parts=[];
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thousand=Math.floor(n/1000); n%=1000;
  const hundred=n;
  if(crore) parts.push(threeDigit(crore)+' কোটি');
  if(lakh) parts.push(threeDigit(lakh)+' লক্ষ');
  if(thousand) parts.push(threeDigit(thousand)+' হাজার');
  if(hundred) parts.push(threeDigit(hundred));
  return parts.join(' ')+' টাকা মাত্র';
}

/* ================= জেনেরিক লিস্ট রেন্ডারার ================= */
function tableHTML(cols, rows){
  let h='<div class="tbl-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c.label+'</th>').join('')+'</tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="'+cols.length+'" class="empty">কোনো তথ্য নেই</td></tr>';
  rows.forEach(row=>{ h+='<tr>'+cols.map(c=>'<td>'+(c.render?c.render(row):esc(row[c.key]))).join('</td>')+'</tr>'; });
  h+='</tbody></table></div>';
  return h;
}

let saleItems=[];
async function loadSaleNew(root){
  const [prodRes, custRes] = await Promise.all([api('accGetProducts',{}), api('accGetCustomers',{})]);
  window._products = prodRes.products||[];

      <div class="row3">

        <div class="field"><label>গ্রাহক (ঐচ্ছিক)</label><select id="s_customer" onchange="pickSaleCustomer()"><option value="">— ওয়াক-ইন কাস্টমার —</option>${window._customers.map(c=>`<option value="${c.id}" data-phone="${esc(c.phone)}" data-address="${esc(c.address)}">${esc(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>পেমেন্ট মাধ্যম</label><select id="s_pm"><option>নগদ</option><option>বিকাশ</option><option>নগদ (Nagad)</option><option>রকেট</option><option>ব্যাংক</option><option>বাকি</option></select></div>
      </div>
      <div class="row3">
        <div class="field"><label>নাম</label><input id="s_name" placeholder="ওয়াক-ইন কাস্টমার"></div>
        <div class="field"><label>মোবাইল</label><input id="s_phone"></div>
        <div class="field"><label>ঠিকানা</label><input id="s_address"></div>
      </div>
      <h3 style="margin:12px 0 6px; color:var(--forest);">পণ্য তালিকা</h3>
      <div id="saleItemsWrap"></div>
      <button class="btn ghost sm" onclick="addSaleItemRow()">+ আরেকটি লাইন</button>
      <div class="totals-box" id="saleTotalsBox"></div>
      <div class="row3" style="margin-top:10px;">
        <div class="field"><label>ডিসকাউন্ট</label><input id="s_discount" type="number" value="0" oninput="renderSaleTotals()"></div>
        <div class="field"><label>পরিশোধ (Paid)</label><input id="s_paid" type="number" value="0" oninput="renderSaleTotals()"></div>
        <div class="field"><label>নোট</label><input id="s_note"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Courier</label><input id="s_courier"></div>
        <div class="field"><label>CTN</label><input id="s_ctn" type="number" value="0"></div>
        <div class="field"><label>Fare</label><input id="s_fare" type="number" value="0"></div>
      </div>
      <div class="row3">
        <div class="field"><label>COD</label><input id="s_cod" type="number" value="0"></div>
      </div>
      <button class="btn gold" style="width:100%; margin-top:8px;" onclick="submitSale()">✅ ইনভয়েস তৈরি করুন</button>
    </div>`;
  renderSaleItems();
}
function pickSaleCustomer(){
  const sel=document.getElementById('s_customer'); const opt=sel.selectedOptions[0];
  if(opt && opt.value){
    document.getElementById('s_name').value = opt.textContent;
    document.getElementById('s_phone').value = opt.dataset.phone||'';
    document.getElementById('s_address').value = opt.dataset.address||'';
  }
}
function renderSaleItems(){
  const wrap=document.getElementById('saleItemsWrap');
  wrap.innerHTML = saleItems.map((it,i)=>`
    <div class="item-row">
      <input list="prodList" placeholder="পণ্যের নাম" value="${esc(it.name)}" onchange="pickSaleProduct(${i}, this.value)">
      <input type="number" placeholder="পরিমাণ" value="${it.qty}" oninput="saleItems[${i}].qty=Number(this.value)||0; renderSaleTotals();">
      <input type="number" placeholder="দর" value="${it.price}" oninput="saleItems[${i}].price=Number(this.value)||0; renderSaleTotals();">
      <div>= ৳${money((it.qty||0)*(it.price||0))}</div>
      <button class="btn danger sm" onclick="removeSaleItem(${i})">✕</button>
    </div>`).join('') + `<datalist id="prodList">${(window._products||[]).map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>`;
  renderSaleTotals();
}
function pickSaleProduct(i, name){
  const p=(window._products||[]).find(x=>x.name===name);
  saleItems[i].name=name;
  if(p){ saleItems[i].product_id=p.id; saleItems[i].price=p.sale_price; saleItems[i].unit=p.unit; }
  renderSaleItems();
}
function addSaleItemRow(){ saleItems.push({name:'',qty:1,price:0,product_id:'',unit:''}); renderSaleItems(); }
function removeSaleItem(i){ saleItems.splice(i,1); if(!saleItems.length) saleItems=[{name:'',qty:1,price:0,product_id:'',unit:''}]; renderSaleItems(); }
function renderSaleTotals(){
  const subtotal = saleItems.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
  const discount = Number(document.getElementById('s_discount')?.value)||0;
  const total = subtotal-discount;
  const paid = Number(document.getElementById('s_paid')?.value)||0;
  const due = total-paid;
  const box=document.getElementById('saleTotalsBox');
  if(box) box.innerHTML = `<div class="tr"><span>সাবটোটাল</span><span>৳${money(subtotal)}</span></div>
    <div class="tr"><span>ডিসকাউন্ট</span><span>৳${money(discount)}</span></div>
    <div class="tr grand"><span>মোট</span><span>৳${money(total)}</span></div>
    <div class="tr"><span>বাকি</span><span>৳${money(due)}</span></div>`;
}
async function submitSale(){
  const items = saleItems.filter(it=>it.name && it.qty);
  if(!items.length){ toast('অন্তত একটা পণ্য যোগ করুন'); return; }
  const payload = {
    date: document.getElementById('s_date').value,
    customer_id: document.getElementById('s_customer').value,
    customer_name: document.getElementById('s_name').value.trim() || 'ওয়াক-ইন কাস্টমার',
    phone: document.getElementById('s_phone').value.trim(),
    address: document.getElementById('s_address').value.trim(),
    payment_method: document.getElementById('s_pm').value,
    discount: Number(document.getElementById('s_discount').value)||0,
    paid: Number(document.getElementById('s_paid').value)||0,
    note: document.getElementById('s_note').value.trim(),
    courier: document.getElementById('s_courier').value.trim(),
    ctn: Number(document.getElementById('s_ctn').value)||0,
    fare: Number(document.getElementById('s_fare').value)||0,
    cod: Number(document.getElementById('s_cod').value)||0,
    items: items.map(it=>({product_id:it.product_id,name:it.name,qty:it.qty,price:it.price,unit:it.unit||''}))
  };
  const r = await api('accCreateSale', payload);
  if(!r.ok){ toast(r.error||'ত্রুটি'); return; }
  toast('ইনভয়েস তৈরি হয়েছে: '+r.invoice_no);
  await printInvoice(r.id);
  loadTab('sale-list'); document.querySelector('[data-tab="sale-list"]').click();
}

async function printInvoice(id){
  const r = await api('accGetSaleDetails', {id});
  if(!r.ok){ toast(r.error||'ত্রুটি'); return; }
  const s=r.sale, shop=r.shop;
  // পুরনো ইনভয়েসে item.unit না থাকলে প্রোডাক্ট লিস্ট থেকে একক খুঁজে নেওয়া হয়
  if(!window._products){ const pr = await api('accGetProducts',{}); window._products = pr.products||[]; }
  const bnNorm = s => String(s||'').normalize('NFC').replace(/[\u200B\u200C\u200D\uFEFF]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const unitOf = it => {
    if (it.unit) return it.unit;
    const byId = (window._products||[]).find(p=>String(p.id)===String(it.product_id));
    if (byId && byId.unit) return byId.unit;
    const nm = bnNorm(it.name);
    let byName = (window._products||[]).find(p=>bnNorm(p.name)===nm);
    const baseName = nm.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (!byName && baseName) byName = (window._products||[]).find(p=>bnNorm(p.name)===baseName);
    if (!byName) {
      const needle = baseName || nm;
      byName = (window._products||[]).find(p=>{ const pn=bnNorm(p.name); return pn && (pn.indexOf(needle)!==-1 || needle.indexOf(pn)!==-1); });
    }
    return (byName && byName.unit) ? byName.unit : '';
  };

  // শুধু যতগুলো পণ্য আছে ততগুলো সারি — অতিরিক্ত খালি ঘর নেই
  const rowsHtml = s.items.map((it,i)=>`<tr>
      <td class="c-no">${i+1}</td>
      <td class="c-desc">${esc(it.name)}</td>
      <td class="c-qty">${money(it.qty)}</td>
      <td class="c-unit">${esc(unitOf(it))}</td>
      <td class="c-price">${money(it.price)}</td>
      <td class="c-amt">${money(it.qty*it.price)}</td>
    </tr>`).join('');

  const tpl = shop.invoice_template || 'classic';
  const color = shop.invoice_color || '#1F5F3F';
  const logoSrc = shop.invoice_logo_url || DEFAULT_INVOICE_LOGO;
  const wordsHtml = shop.invoice_show_words===false ? '' : `<span>কথায়: ${bnAmountInWords(s.total)}</span>`;
  const termsHtml = shop.invoice_terms ? `<div class="inv-terms">${esc(shop.invoice_terms)}</div>` : '';
  const footNoteHtml = shop.invoice_footer_note ? `<div class="inv-footnote">${esc(shop.invoice_footer_note)}</div>` : '';
  const sigHtml = shop.invoice_show_signature===false ? '' : `<div class="inv-foot2"><span>ক্রেতার স্বাক্ষর: .......................</span><span>বিক্রেতার স্বাক্ষর: .............</span></div>`;
  const courierHtml = `<table class="inv-courier">
      <tr><td>Courier: ${esc(s.courier||'')}</td></tr>
      <tr><td>CTN: ${money(s.ctn||0)}</td></tr>
      <tr><td>Delivery Fare: ${money(s.fare||0)}</td></tr>
      <tr><td>COD: ${money(s.cod||0)}</td></tr>
    </table>`;

  document.getElementById('invoicePrint').innerHTML = `
    <div class="inv-box tpl-${esc(tpl)}" style="--inv-color:${esc(color)};">
      <div class="inv-watermark" style="background-image:url('${esc(logoSrc)}');"></div>
      <div class="inv-head2">
        <div class="inv-head-left">
          <img class="inv-logo2" src="${esc(logoSrc)}" alt="logo">
          <div>
            <div class="inv-shop-bn">${esc(shop.shop_name_bn)}</div>
            <div class="inv-shop-en">${esc(shop.shop_name_en)}</div>
            <div class="inv-shop-line">${esc(shop.address)}</div>
            <div class="inv-shop-line">${esc(shop.phone)}</div>
          </div>
        </div>
        <div class="inv-head-right">
          <div class="cash-memo-box">CASH MEMO</div>
          ${shop.fb ? `<div class="inv-contact-line">${esc(shop.fb)}</div>` : ''}
          ${shop.email ? `<div class="inv-contact-line">📧 ${esc(shop.email)}</div>` : ''}
          ${shop.website ? `<div class="inv-contact-line">🌐 ${esc(shop.website)}</div>` : ''}
        </div>
      </div>
      <div class="inv-meta-flex">
        <table class="inv-meta-left">
          <tr><td class="lbl">নাম:</td><td class="val">${esc(s.customer_name)}</td></tr>
          <tr><td class="lbl">ঠিকানা:</td><td class="val">${esc(s.address)}</td></tr>
          <tr><td class="lbl">মোবা:</td><td class="val">${esc(s.phone)}</td></tr>
        </table>
        <div class="inv-meta-right">
          <div class="row"><span class="lbl">চালান নং:</span><span class="val">${esc(s.invoice_no)}</span></div>
          <div class="row"><span class="lbl">তারিখ:</span><span class="val">${esc(s.date)}</span></div>
        </div>
      </div>
      <table class="inv-tbl">
        <thead><tr><th>নং</th><th>বিবরণ</th><th>পরিমান</th><th>একক</th><th>দর</th><th>টাকা</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="inv-summary-flex">
        <div class="inv-words">${wordsHtml}</div>
        <table class="inv-totals">
          <tr class="grand"><td>মোট</td><td>৳${money(s.total)}</td></tr>
          <tr class="paid"><td>পরিশোধ (Paid)</td><td>৳${money(s.paid)}</td></tr>
          <tr class="due"><td>বাকি (Due)</td><td>৳${money(s.due)}</td></tr>
        </table>
      </div>
      ${courierHtml}
      ${termsHtml}
      ${sigHtml}
      ${footNoteHtml}
    </div>`;

  // প্রিন্ট/PDF সেভ করার সময় ফাইলের নাম যেন ইনভয়েস নং হয় (ব্রাউজার document.title থেকে ডিফল্ট ফাইলনেম নেয়)
  const oldTitle = document.title;
  document.title = s.invoice_no || oldTitle;
  const restoreTitle = () => { document.title = oldTitle; window.removeEventListener('afterprint', restoreTitle); };
  window.addEventListener('afterprint', restoreTitle);
  window.print();
}

async function loadJournal(root){
  const coaRes=await api('accGetChartOfAccounts',{}); window._coa=coaRes.accounts||[];
  journalLines=[{account_id:'',debit:0,credit:0},{account_id:'',debit:0,credit:0}];
  const r = await api('accGetJournal', {});
  root.innerHTML = `<div class="card"><h2>📝 নতুন জার্নাল এন্ট্রি</h2>
    <div class="row2">
      <div class="field"><label>তারিখ</label><input id="jr_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>বিবরণ</label><input id="jr_desc"></div>
    </div>
    <div id="jrLinesWrap"></div>
    <button class="btn ghost sm" onclick="journalLines.push({account_id:'',debit:0,credit:0}); renderJournalLines();">+ আরেকটি লাইন</button>
    <div class="totals-box" id="jrTotalsBox"></div>
    <button class="btn gold" style="width:100%; margin-top:8px;" onclick="submitJournal()">✅ পোস্ট করুন</button>
    </div>
    <div class="card"><h2>জার্নাল ইতিহাস</h2>
    ${tableHTML([
      {label:'তারিখ', key:'date'}, {label:'ভাউচার', key:'voucher_no'}, {label:'অ্যাকাউন্ট', key:'account_name'},
      {label:'ডেবিট', render:j=>j.debit?'৳'+money(j.debit):''}, {label:'ক্রেডিট', render:j=>j.credit?'৳'+money(j.credit):''}, {label:'বিবরণ', key:'description'}
    ], r.entries||[])}
    </div>`;
  renderJournalLines();
}
function renderJournalLines(){
  const wrap=document.getElementById('jrLinesWrap');
  wrap.innerHTML = journalLines.map((l,i)=>`
    <div class="item-row" style="grid-template-columns:2fr 1fr 1fr auto;">
      <select onchange="journalLines[${i}].account_id=this.value;">
        <option value="">— অ্যাকাউন্ট বাছুন —</option>
        ${window._coa.map(a=>`<option value="${a.id}" ${l.account_id===a.id?'selected':''}>${esc(a.name)} (${a.type})</option>`).join('')}
      </select>
      <input type="number" placeholder="ডেবিট" value="${l.debit||''}" oninput="journalLines[${i}].debit=Number(this.value)||0; journalLines[${i}].credit=0; renderJournalTotals();">
      <input type="number" placeholder="ক্রেডিট" value="${l.credit||''}" oninput="journalLines[${i}].credit=Number(this.value)||0; journalLines[${i}].debit=0; renderJournalTotals();">
      <button class="btn danger sm" onclick="journalLines.splice(${i},1); renderJournalLines();">✕</button>
    </div>`).join('');
  renderJournalTotals();
}
function renderJournalTotals(){
  const dr=journalLines.reduce((s,l)=>s+(Number(l.debit)||0),0), cr=journalLines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const box=document.getElementById('jrTotalsBox');
  if(box) box.innerHTML = `<div class="tr"><span>মোট ডেবিট</span><span>৳${money(dr)}</span></div><div class="tr"><span>মোট ক্রেডিট</span><span>৳${money(cr)}</span></div><div class="tr grand"><span>${dr===cr?'✅ মিলেছে':'⚠️ অমিল'}</span><span></span></div>`;
}
async function submitJournal(){
  const lines=journalLines.filter(l=>l.account_id && (l.debit||l.credit));
  const r=await api('accAddJournalEntry', {date:document.getElementById('jr_date').value, description:document.getElementById('jr_desc').value.trim(), lines});
  if(r.ok){ toast('জার্নাল পোস্ট হয়েছে'); loadTab('journal'); } else toast(r.error);
}

    <div class="stat"><div class="lbl">পরিশোধিত</div><div class="val">৳${money(r.total_paid)}</div></div>
    <div class="stat warn"><div class="lbl">বাকি</div><div class="val">৳${money(r.total_due)}</div></div>
  </div>`;
}
async function loadRepStock(root){
  const r = await api('accStockReport', {});
  root.innerHTML = `<div class="card"><h2>📦 স্টক রিপোর্ট</h2>
    <p class="muted">মোট স্টক মূল্য: ৳${money(r.total_stock_value)}</p>
    ${tableHTML([
      {label:'পণ্য', key:'name'}, {label:'ক্যাটাগরি', key:'category'}, {label:'স্টক', render:p=>p.current_stock+' '+esc(p.unit)},
      {label:'স্টক মূল্য', render:p=>'৳'+money(p.stock_value)}, {label:'অবস্থা', render:p=>p.low_stock?'<span class="tag warn">⚠ কম স্টক</span>':'<span class="tag ok">ঠিক আছে</span>'}
    ], r.products||[])}
    </div>`;
}

/* ================= সেটিংস ================= */
async function loadSettings(root){
  const r = await api('accGetSettings', {});
  const listsRes = await api('accGetLists', {});
  const s = r.settings, lists = listsRes.lists;
  root.innerHTML = `<div class="card"><h2>⚙️ দোকানের তথ্য</h2>
    <div class="row2">
      <div class="field"><label>দোকানের নাম (বাংলা)</label><input id="st_name_bn" value="${esc(s.shop_name_bn)}"></div>
      <div class="field"><label>নাম (English)</label><input id="st_name_en" value="${esc(s.shop_name_en)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>ফোন</label><input id="st_phone" value="${esc(s.phone)}"></div>
      <div class="field"><label>ইমেইল</label><input id="st_email" value="${esc(s.email)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>ফেসবুক (যেমন: facebook.com/methomart)</label><input id="st_fb" value="${esc(s.fb||'')}"></div>
      <div class="field"><label>ওয়েবসাইট</label><input id="st_website" value="${esc(s.website||'')}"></div>
    </div>
    <div class="field"><label>ঠিকানা</label><input id="st_address" value="${esc(s.address)}"></div>
    <div class="row2">
      <div class="field"><label>ব্যাংক হিসাবের নাম</label><input id="st_bank_name" value="${esc(s.bank_name)}"></div>
      <div class="field"><label>ব্যাংক প্রারম্ভিক ব্যালেন্স</label><input id="st_bank_opening" type="number" value="${s.bank_opening||0}"></div>
    </div>
    <div class="field"><label>নগদ প্রারম্ভিক ব্যালেন্স</label><input id="st_cash_opening" type="number" value="${s.cash_opening||0}"></div>
    <button class="btn gold" onclick="saveSettingsForm()">সংরক্ষণ করুন</button>
  </div>
  <div class="card"><h2>🧾 ইনভয়েস কাস্টমাইজেশন</h2>
    <div class="row2">
      <div class="field"><label>লোগো URL (ঐচ্ছিক — খালি রাখলে মেথোমার্টের ডিফল্ট লোগো বসবে)</label><input id="st_inv_logo" placeholder="https://..." value="${esc(s.invoice_logo_url||'')}"></div>
      <div class="field"><label>থিম কালার</label><input id="st_inv_color" type="color" value="${esc(s.invoice_color||'#1F5F3F')}" style="height:42px; padding:4px;"></div>
    </div>
    <div class="field"><label>ইনভয়েস টেমপ্লেট</label>
      <select id="st_inv_template">
        <option value="classic" ${s.invoice_template==='classic'?'selected':''}>ক্লাসিক (মেমো স্টাইল)</option>
        <option value="modern" ${s.invoice_template==='modern'?'selected':''}>মডার্ন (রঙিন হেডার)</option>
        <option value="minimal" ${s.invoice_template==='minimal'?'selected':''}>মিনিমাল (হালকা বর্ডার)</option>
      </select>
    </div>
    <div class="field"><label>ফুটার নোট (যেমন: ধন্যবাদ বার্তা)</label><input id="st_inv_footer" value="${esc(s.invoice_footer_note||'')}"></div>
    <div class="field"><label>শর্তাবলী / নোট (ঐচ্ছিক, একাধিক লাইন)</label><textarea id="st_inv_terms" rows="3" style="width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit;">${esc(s.invoice_terms||'')}</textarea></div>
    <div class="row2">
      <label style="display:flex; align-items:center; gap:8px; font-weight:600;"><input id="st_inv_signature" type="checkbox" ${s.invoice_show_signature!==false?'checked':''} style="width:auto;"> স্বাক্ষরের ঘর দেখান</label>
      <label style="display:flex; align-items:center; gap:8px; font-weight:600;"><input id="st_inv_words" type="checkbox" ${s.invoice_show_words!==false?'checked':''} style="width:auto;"> মোট টাকা কথায় দেখান</label>
    </div>
    <button class="btn gold" style="margin-top:10px;" onclick="saveSettingsForm()">সংরক্ষণ করুন</button>
    <p class="muted" style="margin-top:8px;">পরিবর্তন সেভ করার পর যেকোনো ইনভয়েস 🖨️ করে দেখে নিতে পারেন।</p>
  </div>
  <div class="card"><h2>খরচের খাত তালিকা</h2>
    <div id="expHeadList">${lists.expense_head.map(h=>`<span class="tag mid" style="margin:3px;">${esc(h)} <a href="#" onclick="delListItem('expense_head','${esc(h)}');return false;" style="color:var(--danger);">✕</a></span>`).join('')}</div>
    <div class="row2" style="margin-top:10px;"><input id="newExpHead" placeholder="নতুন খাত"> <button class="btn ghost" onclick="addListItem('expense_head')">+ যোগ করুন</button></div>
  </div>
  <div class="card"><h2>পেমেন্ট মাধ্যম তালিকা</h2>
    <div id="pmList">${lists.payment_method.map(h=>`<span class="tag mid" style="margin:3px;">${esc(h)} <a href="#" onclick="delListItem('payment_method','${esc(h)}');return false;" style="color:var(--danger);">✕</a></span>`).join('')}</div>
    <div class="row2" style="margin-top:10px;"><input id="newPm" placeholder="নতুন মাধ্যম"> <button class="btn ghost" onclick="addListItem('payment_method')">+ যোগ করুন</button></div>
  </div>`;
}
async function saveSettingsForm(){
  const settings = {
    shop_name_bn: document.getElementById('st_name_bn').value, shop_name_en: document.getElementById('st_name_en').value,
    phone: document.getElementById('st_phone').value, email: document.getElementById('st_email').value,
    fb: document.getElementById('st_fb').value.trim(), website: document.getElementById('st_website').value.trim(),
    address: document.getElementById('st_address').value, bank_name: document.getElementById('st_bank_name').value,
    bank_opening: Number(document.getElementById('st_bank_opening').value)||0, cash_opening: Number(document.getElementById('st_cash_opening').value)||0,
    invoice_logo_url: document.getElementById('st_inv_logo').value.trim(), invoice_color: document.getElementById('st_inv_color').value,
    invoice_template: document.getElementById('st_inv_template').value, invoice_footer_note: document.getElementById('st_inv_footer').value.trim(),
    invoice_terms: document.getElementById('st_inv_terms').value.trim(),
    invoice_show_signature: document.getElementById('st_inv_signature').checked, invoice_show_words: document.getElementById('st_inv_words').checked
  };
  const r = await api('accSaveSettings', {settings});
  if(r.ok) toast('সংরক্ষিত হয়েছে'); else toast(r.error);
}
async function addListItem(type){
  const inputId = type==='expense_head'?'newExpHead':'newPm';
  const value=document.getElementById(inputId).value.trim();
  if(!value) return;
  const r=await api('accAddListItem',{type,value});
  if(r.ok){ toast('যোগ হয়েছে'); loadTab('settings'); } else toast(r.error);
}
async function delListItem(type,value){
  const r=await api('accDeleteListItem',{type,value});
  if(r.ok){ toast('মুছে ফেলা হয়েছে'); loadTab('settings'); } else toast(r.error);
}

/* ================= ট্যাব ম্যাপ ================= */
const TAB_LOADERS = {
  'dashboard': loadDashboard,
  'sale-new': loadSaleNew, 'sale-list': loadSaleList, 'sale-return': loadSaleReturn,
  'purchase-new': loadPurchaseNew, 'purchase-list': loadPurchaseList, 'purchase-return': loadPurchaseReturn,
  'customers': loadCustomers, 'suppliers': loadSuppliers, 'products': loadProducts, 'inventory': loadInventory,
  'expenses': loadExpenses, 'cashbank': loadCashBank,
  'coa': loadCOA, 'journal': loadJournal, 'ledger': loadLedger, 'trialbalance': loadTrialBalance,
  'rep-pl': loadRepPL, 'rep-bs': loadRepBS, 'rep-sales': loadRepSales, 'rep-purchase': loadRepPurchase, 'rep-stock': loadRepStock,
  'settings': loadSettings
};

/* boot() ব্যবহার করে dashboard/অন্য ট্যাব লোড করে, তাই এটা অবশ্যই TAB_LOADERS
   ডিফাইন হওয়ার পরে কল করতে হবে — আগে কল করলে প্রথমবার পেজ খোলার সময়
   "TAB_LOADERS is not defined" এরর হয়ে ড্যাশবোর্ডের ডাটা লোড হতো না
   (ট্যাবে ক্লিক করলে তখন কাজ করত, কারণ ততক্ষণে পুরো স্ক্রিপ্ট লোড হয়ে যেত)। */
boot();
</script>
